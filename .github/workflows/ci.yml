name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    env:
      PYTHONUTF8: '1'
      UV_LINK_MODE: copy
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked tooling and dependencies
        run: uv sync --locked --group dev --no-install-project
      - name: Install project with locked build tooling
        run: uv sync --locked --group dev --no-build-isolation
      - name: Check lint
        run: uv run --no-sync ruff check .
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Run offline tests
        run: uv run --no-sync pytest --basetemp "${{ runner.temp }}/market-briefing-tests"
      - name: Build wheel and source distribution
        run: uv build --no-build-isolation --out-dir "${{ runner.temp }}/market-briefing-dist"
